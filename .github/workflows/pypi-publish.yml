name: Publish

# Real publishes happen only on a v* tag push. workflow_dispatch is a dry run:
# it builds and checks the package but never publishes, so who can release is
# exactly who can push a v* tag (enforced by a tag ruleset), not who can click
# "Run workflow".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Always runs. On workflow_dispatch this is the whole thing (a dry run). On a
  # v* tag push it also gates the publish job: the tag has to match the packaged
  # version, and the build + checks have to pass, before anything is published.
  # The artifact it uploads is exactly what gets published, so the bytes that
  # reach PyPI are the bytes that were tested and twine-checked here.
  build:
    name: Build and check
    runs-on: tenki-standard-small-2c-4g
    outputs:
      published: ${{ steps.version.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Build
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Check LICENSE is packaged
        shell: python
        run: |
          import glob, sys, tarfile, zipfile

          missing = []
          for whl in glob.glob("dist/*.whl"):
              if not any(n.endswith(".dist-info/licenses/LICENSE") for n in zipfile.ZipFile(whl).namelist()):
                  missing.append(whl)
          for sdist in glob.glob("dist/*.tar.gz"):
              if not any(n.count("/") == 1 and n.endswith("/LICENSE") for n in tarfile.open(sdist).getnames()):
                  missing.append(sdist)
          for path in missing:
              print(f"::error::{path} does not include LICENSE")
          sys.exit(1 if missing else 0)

      - name: Verify tag matches version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag=${tag} pyproject-version=${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag v${tag} does not match pyproject.toml version ${version}"
            exit 1
          fi

      - name: Check if version is already published
        id: version
        run: |
          set -euo pipefail

          NAME=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')

          if curl -fsS "https://pypi.org/pypi/${NAME}/${VERSION}/json" >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Real publish. Only a v* tag push reaches this job, and it is the only one
  # bound to the pypi-publish environment / OIDC trusted publisher. It runs no
  # arbitrary code before the publish: it downloads the exact dist/ the build
  # job tested and twine-checked, and publishes that.
  publish:
    name: Publish to PyPI
    needs: build
    if: ${{ github.event_name == 'push' && needs.build.outputs.published == 'false' }}
    runs-on: tenki-standard-small-2c-4g
    environment: pypi-publish
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
