name: Publish

# Real publishes happen only on a v* tag push. workflow_dispatch is a dry run:
# it builds and checks the package but never publishes, so who can release is
# exactly who can push a v* tag (enforced by a tag ruleset), not who can click
# "Run workflow".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Always runs. On workflow_dispatch this is the whole thing (a dry run). On a
  # v* tag push it also gates the publish job: the tag has to match the packaged
  # version, and the build + checks have to pass, before anything is published.
  # The artifact it uploads is exactly what gets published, so the bytes that
  # reach PyPI are the bytes that were tested and twine-checked here.
  build:
    name: Build and check
    runs-on: tenki-standard-small-2c-4g
    outputs:
      published: ${{ steps.version.outputs.published }}
      luxorai_published: ${{ steps.luxorai.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Build
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Verify tag matches version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag=${tag} pyproject-version=${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag v${tag} does not match pyproject.toml version ${version}"
            exit 1
          fi

      - name: Check if version is already published
        id: version
        run: |
          set -euo pipefail

          NAME=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')

          if curl -fsS "https://pypi.org/pypi/${NAME}/${VERSION}/json" >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

      # Luxor AI dual publish: the same source and version built as luxor-ai,
      # with the same checks. Off until a human sets the repository variable
      # LUXORAI_PUBLISH=true after configuring the luxor-ai trusted publisher
      # (this repo, pypi-publish.yml, environment pypi-publish).
      - name: Build luxor-ai
        if: vars.LUXORAI_PUBLISH == 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/luxorai-src"
          mkdir -p "$src"
          git archive HEAD | tar -x -C "$src"
          python - "$src/pyproject.toml" <<'PY'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          text, n = re.subn(r'(?m)^name = "tenki"$', 'name = "luxor-ai"', text, count=1)
          if n != 1:
              sys.exit("::error::could not rewrite [project] name in pyproject.toml")
          open(path, "w", encoding="utf-8").write(text)
          PY
          python -m build --outdir dist-luxorai "$src"

      - name: Check luxor-ai package
        if: vars.LUXORAI_PUBLISH == 'true'
        run: |
          set -euo pipefail
          twine check dist-luxorai/*
          python - <<'PY'
          import email, glob, sys, tomllib, zipfile
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          wheels = glob.glob("dist-luxorai/*.whl")
          if len(wheels) != 1:
              sys.exit(f"::error::expected one luxor-ai wheel, found {wheels}")
          with zipfile.ZipFile(wheels[0]) as whl:
              names = whl.namelist()
              meta = email.message_from_bytes(
                  whl.read(next(n for n in names if n.endswith(".dist-info/METADATA")))
              )
          if (meta["Name"], meta["Version"]) != ("luxor-ai", version):
              sys.exit(f"::error::wheel metadata is {meta['Name']} {meta['Version']}")
          for pkg in ("luxor_ai", "tenki", "tenki_sandbox"):
              if f"{pkg}/__init__.py" not in names:
                  sys.exit(f"::error::luxor-ai wheel is missing {pkg}")
          print(f"luxor-ai {version}: {wheels[0]} ok")
          PY

      - name: Check if luxor-ai version is already published
        id: luxorai
        if: vars.LUXORAI_PUBLISH == 'true'
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if curl -fsS "https://pypi.org/pypi/luxor-ai/${VERSION}/json" >/dev/null 2>&1; then
            echo "luxor-ai@${VERSION} already published, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload luxor-ai distribution
        if: vars.LUXORAI_PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-luxorai
          path: dist-luxorai/
          retention-days: 1
          if-no-files-found: error

  # Real publish. Only a v* tag push reaches this job, and it is the only one
  # bound to the pypi-publish environment / OIDC trusted publisher. It runs no
  # arbitrary code before the publish: it downloads the exact dist/ the build
  # job tested and twine-checked, and publishes that.
  publish:
    name: Publish to PyPI
    needs: build
    if: ${{ github.event_name == 'push' && needs.build.outputs.published == 'false' }}
    runs-on: tenki-standard-small-2c-4g
    environment: pypi-publish
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      # Runs only after the tenki publish above succeeded, from the luxor-ai
      # dist/ the build job built and checked.
      - name: Download luxor-ai distribution
        if: vars.LUXORAI_PUBLISH == 'true' && needs.build.outputs.luxorai_published == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-luxorai
          path: dist-luxorai/

      - name: Publish luxor-ai to PyPI
        if: vars.LUXORAI_PUBLISH == 'true' && needs.build.outputs.luxorai_published == 'false'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-luxorai/
