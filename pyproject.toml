[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tenki-sandbox"
version = "0.3.6"
description = "Python SDK for Tenki Sandbox"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tenki Cloud" }]
dependencies = [
  "grpcio>=1.73",
  "protobuf>=6.31",
  "websocket-client>=1.6",
]

[project.optional-dependencies]
# Async SSH transport (AsyncSandbox.ssh) needs an async WebSocket client.
async = [
  "websockets>=12",
]
dev = [
  "grpcio-tools>=1.73",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "websockets>=12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tenki_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
