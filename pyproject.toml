[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tenki"
version = "1.1.0"
description = "Tenki Cloud Python SDK — cloud sandboxes (microVMs) for AI agents and code execution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tenki Cloud" }]
keywords = [
  "tenki",
  "sandbox",
  "microvm",
  "ai-agents",
  "agents",
  "code-execution",
  "code-interpreter",
  "cloud",
]
dependencies = [
  "grpcio>=1.73",
  "protobuf>=5.29.5",
  "websocket-client>=1.6",
]

[project.urls]
Homepage = "https://tenki.cloud"
Documentation = "https://tenki.cloud/docs/sandbox/sdk"
Repository = "https://github.com/LuxorLabs/tenki-sdk-python"
Issues = "https://github.com/LuxorLabs/tenki-sdk-python/issues"

[project.optional-dependencies]
# Async SSH transport (AsyncSandbox.ssh) needs an async WebSocket client.
async = [
  "websockets>=12",
]
dev = [
  "grpcio-tools>=1.73",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "websockets>=12",
]

# `tenki` ships both the canonical `tenki` namespace and the legacy
# `tenki_sandbox` implementation package, so `import tenki` and
# `import tenki_sandbox` both resolve from this one distribution.
[tool.hatch.build.targets.wheel]
packages = ["src/tenki", "src/tenki_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
